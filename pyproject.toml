[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robotgym"
version = "0.1.0"
description = "Gymnasium environment for the ELEGOO Conqueror robot tank"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.21",
    "pillow>=9.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]      # RoboGym(serial_port=...) - USB tether instead of WiFi
render = ["opencv-python>=4.5"] # render_mode="human"
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["robotgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
